# Velum defaults. Personal ~/.config/kitty/kitty.conf takes precedence.
shell /usr/bin/fish
font_family JetBrains Mono Nerd Font
font_size 11
background #15131c
foreground #eee8f5
cursor #c5aff1
selection_background #c5aff1
selection_foreground #30223f
background_opacity 0.95
window_padding_width 8
color0 #25212f
color1 #ed8796
color2 #b4d1be
color3 #e5c890
color4 #9bb5e8
color5 #c5aff1
color6 #9dcbd1
color7 #d9d0e4
color8 #776a85
color9 #f4a8b3
color10 #c5e0cd
color11 #f2d9aa
color12 #b4ccf5
color13 #dbc5ff
color14 #b5e0e5
color15 #eee8f5
map ctrl+c copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
