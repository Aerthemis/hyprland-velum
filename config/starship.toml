# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$username$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#4A4453'

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[ ](bold fg:#D6BAFF)"
error_symbol = "[ ](bold fg:#FFB4AB)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:#503E6E"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#503E6E)[$symbol $branch(:$remote_branch)](fg:#C2ABE3 bg:#503E6E)[ ](bold fg:#503E6E)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:#503E6E bold fg:#C2ABE3)[](bold fg:#503E6E)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#503E6E fg:#C2ABE3"
style_root = "red bold"
format = "[$user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#D6BAFF fg:#420089"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#D6BAFF)[󰉋 → $path]($style)[](bold fg:#D6BAFF)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#503E6E)[󰪢 $duration](bold bg:#503E6E fg:#C2ABE3)[](bold fg:#503E6E)'
